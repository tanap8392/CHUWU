# CHUWU dashboard (Decap CMS at /admin). Edits are saved as drafts first (Workflow tab); clicking
# Publish commits the content/*.json file to GitHub and Netlify redeploys — live about a minute later.
# Live previews beside each form are defined in admin/previews.js.
# Lets the dashboard run on this computer (npx decap-server + a local web server) and edit
# the files here directly. Only used on localhost; the live site ignores it.
local_backend: true

backend:
  name: git-gateway
  branch: main

# Drafts → In review → Ready, then Publish. Unpublished drafts never reach the live site.
publish_mode: editorial_workflow
logo_url: https://chuwu-fragrance.netlify.app/assets/img/logo.svg

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

site_url: https://chuwu-fragrance.netlify.app
display_url: https://chuwu-fragrance.netlify.app

collections:
  # ---------------------------------------------------------------- Products
  - name: "products"
    label: "Products"
    description: "Everything for sale: signature blends, personalized blend bottle sizes, and the element scents (J01–T03)."
    files:
      - file: "content/products.json"
        name: "products"
        label: "All Products"
        fields:
          - label: "Products"
            name: "products"
            label_singular: "Product"
            widget: "list"
            typeKey: "type"
            hint: "Drag to reorder — the Shop page shows products in this order."
            types:
              - label: "Signature Blend"
                name: "signature"
                widget: "object"
                summary: "{{fields.name}} — {{fields.size}} — {{fields.status}}"
                fields:
                  - { label: "ID", name: "id", widget: "string", hint: "Short internal name, e.g. chi-xia. Don't change it once the product is on sale — carts use it." }
                  - { label: "Name", name: "name", widget: "string", hint: "e.g. Chì Xiá — Crimson Glow" }
                  - { label: "Chinese name", name: "name_zh", widget: "string", required: false }
                  - { label: "Intention", name: "intention", widget: "string", required: false, hint: "Shown as \"For …\", e.g. Love Luck" }
                  - label: "Elements"
                    name: "elements"
                    widget: "select"
                    multiple: true
                    options: &elements
                      - { label: "Wood 木", value: "Wood" }
                      - { label: "Fire 火", value: "Fire" }
                      - { label: "Earth 土", value: "Earth" }
                      - { label: "Metal 金", value: "Metal" }
                      - { label: "Water 水", value: "Water" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Top notes", name: "top", widget: "string", required: false }
                  - { label: "Middle notes", name: "middle", widget: "string", required: false }
                  - { label: "Base notes", name: "base", widget: "string", required: false }
                  - { label: "Size", name: "size", widget: "string", default: "30ml" }
                  - &price { label: "Price (SGD)", name: "price", widget: "number", value_type: "float", min: 0, step: 0.1 }
                  - &compare { label: "Original price", name: "compare_at_price", widget: "number", value_type: "float", min: 0, step: 0.1, required: false, hint: "Fill in to show a sale: this price appears crossed out next to the real price. Leave empty for no sale." }
                  - &image { label: "Main photo", name: "image", widget: "image", required: false }
                  - &gallery
                    label: "More photos"
                    name: "gallery"
                    widget: "list"
                    required: false
                    summary: "{{fields.image}}"
                    hint: "Extra photos shown as thumbnails under the main photo."
                    field: { label: "Photo", name: "image", widget: "image" }
                  - &badge
                    label: "Badge"
                    name: "badge"
                    widget: "select"
                    required: false
                    default: ""
                    hint: "A small label on the photo."
                    options:
                      - { label: "None", value: "" }
                      - { label: "New", value: "New" }
                      - { label: "Bestseller", value: "Bestseller" }
                      - { label: "Limited Edition", value: "Limited Edition" }
                      - { label: "Back in Stock", value: "Back in Stock" }
                      - { label: "Sale", value: "Sale" }
                      - { label: "Gift Idea", value: "Gift Idea" }
                  - &status
                    label: "Status"
                    name: "status"
                    widget: "select"
                    default: "active"
                    options:
                      - { label: "On sale", value: "active" }
                      - { label: "Coming soon (shown, can't be bought)", value: "coming_soon" }
                      - { label: "Sold out (shown, can't be bought)", value: "sold_out" }
                      - { label: "Hidden (not shown anywhere)", value: "hidden" }
              - label: "Personalized Blend (bottle size)"
                name: "personalized"
                widget: "object"
                summary: "{{fields.name}} — {{fields.size}} — {{fields.status}}"
                fields:
                  - { label: "ID", name: "id", widget: "string", hint: "e.g. blend-10ml. Don't change it once on sale." }
                  - { label: "Name", name: "name", widget: "string", default: "Personalized Chu Wu Blend" }
                  - { label: "Size", name: "size", widget: "string", hint: "Shown in the Bottle Size picker on the Bazi page, e.g. 10ml" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - *price
                  - *compare
                  - *image
                  - *gallery
                  - *badge
                  - *status
              - label: "Element Scent"
                name: "element_scent"
                widget: "object"
                summary: "{{fields.code}} — {{fields.element}} — {{fields.status}}"
                fields:
                  - { label: "Code", name: "code", widget: "string", hint: "e.g. J01. J=Metal, M=Wood, S=Water, H=Fire, T=Earth. Don't change it once on sale." }
                  - { label: "Element", name: "element", widget: "select", options: *elements }
                  - label: "Scent family"
                    name: "family"
                    widget: "select"
                    options: &families
                      - { label: "Citrus", value: "Citrus" }
                      - { label: "Floral", value: "Floral" }
                      - { label: "Woody", value: "Woody" }
                      - { label: "Fresh & Green", value: "Fresh" }
                      - { label: "Spicy & Warm", value: "Spicy" }
                      - { label: "Sweet & Gourmand", value: "Sweet" }
                      - { label: "Musky & Sensual", value: "Musky" }
                  - { label: "Scent profile", name: "profile", widget: "string", required: false, hint: "e.g. Floral Aldehyde, Woody Spicy" }
                  - { label: "Inspired by", name: "inspired_by", widget: "string", required: false, hint: "The perfume it's inspired by. Leave empty to hide the line." }
                  - { label: "Description", name: "description", widget: "text", required: false, hint: "A short write-up shown on the Shop and recommendation cards." }
                  - { label: "Notes", name: "notes", widget: "text", hint: "One line each, e.g. Top: Lemon, Bergamot (Enter) Middle: … (Enter) Base: …" }
                  - label: "Sizes & prices"
                    name: "sizes"
                    label_singular: "Size"
                    widget: "list"
                    summary: "{{fields.size}} — S${{fields.price}}"
                    hint: "Customers pick one of these sizes. Put the smallest first — it's the one selected to start with."
                    default: [{ size: "10ml", price: 24.9 }, { size: "30ml", price: 49.9 }]
                    fields:
                      - { label: "Size", name: "size", widget: "string", hint: "e.g. 10ml" }
                      - { label: "Price (SGD)", name: "price", widget: "number", value_type: "float", min: 0, step: 0.1 }
                      - { label: "Original price", name: "compare_at_price", widget: "number", value_type: "float", min: 0, step: 0.1, required: false, hint: "Fill in to show this size on sale (crossed-out price)." }
                  - *image
                  - *gallery
                  - *badge
                  - *status

  # ---------------------------------------------------------------- Promotions
  - name: "promotions"
    label: "Promotions"
    description: "Promo codes and automatic offers. Only one offer applies per order: the one that saves the customer the most."
    files:
      - file: "content/promotions.json"
        name: "promotions"
        label: "All Promotions"
        fields:
          - label: "Promotions"
            name: "promotions"
            label_singular: "Promotion"
            widget: "list"
            summary: "{{fields.name}} — {{fields.code}}"
            fields:
              - { label: "Name", name: "name", widget: "string", hint: "Shown to the customer at checkout, e.g. \"Mid-Autumn 15% off\"" }
              - { label: "Active", name: "active", widget: "boolean", default: true }
              - { label: "Promo code", name: "code", widget: "string", required: false,
                  hint: "What customers type at checkout. Not case-sensitive. Note: codes can be found by anyone who looks at the site's files, so treat them as public." }
              - { label: "Apply automatically (no code needed)", name: "auto_apply", widget: "boolean", default: false }
              - label: "Type"
                name: "type"
                widget: "select"
                default: "percent"
                options:
                  - { label: "% off", value: "percent" }
                  - { label: "Fixed amount off (SGD)", value: "fixed" }
                  - { label: "Free delivery", value: "free_delivery" }
              - { label: "Value", name: "value", widget: "number", value_type: "float", min: 0, default: 10, hint: "10 = 10% off or S$10 off. Ignored for free delivery." }
              - { label: "Minimum spend (SGD)", name: "min_subtotal", widget: "number", value_type: "float", min: 0, default: 0, required: false }
              - label: "Applies to"
                name: "applies_to"
                widget: "select"
                default: "all"
                options:
                  - { label: "Everything", value: "all" }
                  - { label: "Signature blends only", value: "signature" }
                  - { label: "Personalized blends only", value: "personalized" }
                  - { label: "Element scents only", value: "element_scent" }
              - { label: "Starts", name: "starts", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Ends (inclusive)", name: "ends", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }

  # ---------------------------------------------------------------- Pages (text & images)
  - name: "pages"
    label: "Page Content"
    description: "Headlines, text, buttons and hero media for each page."
    files:
      - file: "content/home.json"
        name: "home"
        label: "Home Page"
        fields:
          - label: "Search & sharing"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser tab / Google title", name: "title", widget: "string" }
              - { label: "Google description", name: "description", widget: "text" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Chinese mark", name: "cn_mark", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "text", hint: "Press Enter for a line break." }
              - { label: "Intro text", name: "lede", widget: "text" }
              - { label: "Main button text", name: "primary_label", widget: "string" }
              - { label: "Main button link", name: "primary_link", widget: "string" }
              - { label: "Second button text", name: "secondary_label", widget: "string" }
              - { label: "Second button link", name: "secondary_link", widget: "string" }
              - { label: "Background video (MP4)", name: "video", widget: "file", hint: "Keep it under ~10 MB so the page loads quickly." }
              - { label: "Poster image (shown while the video loads)", name: "poster", widget: "image" }
          - label: "Philosophy section"
            name: "philosophy"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - label: "Element cards"
                name: "elements"
                widget: "list"
                summary: "{{fields.glyph}} {{fields.element}}"
                fields:
                  - { label: "Element", name: "element", widget: "select", options: *elements }
                  - { label: "Character", name: "glyph", widget: "string" }
                  - { label: "Theme word", name: "theme", widget: "string" }
                  - { label: "Line", name: "line", widget: "string" }
          - label: "How It Works section"
            name: "how"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "body", widget: "text" }
              - { label: "Button text", name: "cta_label", widget: "string" }
              - { label: "Button link", name: "cta_link", widget: "string" }

      - file: "content/shop.json"
        name: "shop"
        label: "Shop Page"
        fields:
          - label: "Search & sharing"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser tab / Google title", name: "title", widget: "string" }
              - { label: "Google description", name: "description", widget: "text" }
          - label: "Signature blends section"
            name: "signature"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "lede", widget: "text" }
          - label: "Element scents section"
            name: "element_scents"
            widget: "object"
            hint: "Only appears once at least one element scent is set to \"On sale\"."
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "lede", widget: "text" }
          - label: "Personalized blend section"
            name: "personalized"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "lede", widget: "text" }
          - label: "Closing call to action"
            name: "closing"
            widget: "object"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Button text", name: "cta_label", widget: "string" }

      - file: "content/customize.json"
        name: "customize"
        label: "Bazi Customize Page"
        fields:
          - label: "Search & sharing"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser tab / Google title", name: "title", widget: "string" }
              - { label: "Google description", name: "description", widget: "text" }
          - label: "Page header"
            name: "header"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "lede", widget: "text" }
          - label: "Recommended scents section"
            name: "recommend"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "lede", widget: "text" }
              - { label: "Small print", name: "explainer", widget: "text" }
          - label: "Build your own section"
            name: "build"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "lede", widget: "text" }
          - { label: "Disclaimer", name: "disclaimer", widget: "text" }

  # ---------------------------------------------------------------- Info pages
  - name: "info"
    label: "Info Pages"
    description: "About, FAQ, Shipping & Returns and Privacy Policy. Switch on \"Show on site\" to publish a page and add it to the footer. Text uses Markdown: ## Heading, **bold**, - list item."
    files:
      - file: "content/pages/about.json"
        name: "about"
        label: "About"
        fields:
          - { label: "Show on site", name: "published", widget: "boolean", default: false }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro line", name: "intro", widget: "string", required: false }
          - { label: "Text", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list", "quote"], editor_components: [] }
          - { label: "Search & sharing", name: "seo", widget: "object", collapsed: true, fields: [{ label: "Google description", name: "description", widget: "text", required: false }] }
      - file: "content/pages/shipping.json"
        name: "shipping"
        label: "Shipping & Returns"
        fields:
          - { label: "Show on site", name: "published", widget: "boolean", default: false }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro line", name: "intro", widget: "string", required: false }
          - { label: "Text", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list", "quote"], editor_components: [] }
          - { label: "Search & sharing", name: "seo", widget: "object", collapsed: true, fields: [{ label: "Google description", name: "description", widget: "text", required: false }] }
      - file: "content/pages/privacy.json"
        name: "privacy"
        label: "Privacy Policy"
        fields:
          - { label: "Show on site", name: "published", widget: "boolean", default: false }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro line", name: "intro", widget: "string", required: false }
          - { label: "Text", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list", "quote"], editor_components: [] }
          - { label: "Search & sharing", name: "seo", widget: "object", collapsed: true, fields: [{ label: "Google description", name: "description", widget: "text", required: false }] }
      - file: "content/pages/faq.json"
        name: "faq"
        label: "FAQ"
        fields:
          - { label: "Show on site", name: "published", widget: "boolean", default: false }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro line", name: "intro", widget: "string", required: false }
          - label: "Questions"
            name: "items"
            label_singular: "Question"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "markdown", buttons: ["bold", "italic", "link", "bulleted-list"], editor_components: [] }
          - { label: "Search & sharing", name: "seo", widget: "object", collapsed: true, fields: [{ label: "Google description", name: "description", widget: "text", required: false }] }

  # ---------------------------------------------------------------- Note library
  - name: "ingredients"
    label: "Note Library"
    description: "The notes customers choose from in Build Your Own, with their element, family and stock."
    files:
      - file: "content/notes.json"
        label: "All Notes"
        name: "notes"
        fields:
          - label: "Notes"
            name: "notes"
            label_singular: "Note"
            widget: "list"
            summary: "{{fields.name}} ({{fields.layer}}, {{fields.element}}) — {{fields.stock}}"
            fields:
              - label: "Layer"
                name: "layer"
                widget: "select"
                options: ["top", "middle", "base"]
              - { label: "Note name", name: "name", widget: "string" }
              - { label: "Chinese name", name: "zh", widget: "string", required: false }
              - { label: "Element", name: "element", widget: "select", options: *elements }
              - { label: "Scent family", name: "family", widget: "select", options: *families }
              - label: "Stock"
                name: "stock"
                widget: "select"
                default: "in_stock"
                options:
                  - { label: "Available", value: "in_stock" }
                  - { label: "Low stock", value: "low_stock" }
                  - { label: "Unavailable", value: "sold_out" }

  # ---------------------------------------------------------------- Settings
  - name: "settings"
    label: "Site Settings"
    description: "Brand, colours, announcement bar, contact details, features, delivery and payment."
    files:
      - file: "content/settings.json"
        name: "settings"
        label: "Settings"
        fields:
          - label: "Announcement bar"
            name: "announcement"
            widget: "object"
            hint: "A thin strip across the top of every page, e.g. for a sale."
            fields:
              - { label: "Show it", name: "enabled", widget: "boolean", default: false }
              - { label: "Text", name: "text", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. shop.html" }
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Chinese name", name: "name_zh", widget: "string" }
              - { label: "Footer tagline", name: "tagline", widget: "string" }
              - { label: "Logo (dark, for the light header)", name: "logo", widget: "image" }
              - { label: "Logo (light, for the dark footer)", name: "logo_light", widget: "image" }
          - label: "Colours"
            name: "theme"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background (ivory)", name: "ivory", widget: "color" }
              - { label: "Text & buttons (charcoal)", name: "charcoal", widget: "color" }
              - { label: "Accent (gold)", name: "gold", widget: "color" }
              - { label: "Borders (grey)", name: "grey", widget: "color" }
              - { label: "Hover (ink)", name: "ink", widget: "color" }
              - { label: "Wood", name: "wood", widget: "color" }
              - { label: "Fire", name: "fire", widget: "color" }
              - { label: "Earth", name: "earth", widget: "color" }
              - { label: "Metal", name: "metal", widget: "color" }
              - { label: "Water", name: "water", widget: "color" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "WhatsApp number", name: "whatsapp_number", widget: "string", hint: "Digits only with country code, e.g. 6580285156. Orders and payment screenshots are sent here." }
              - { label: "WhatsApp number as shown", name: "whatsapp_display", widget: "string", hint: "e.g. +65 8028 5156" }
              - { label: "Instagram link", name: "instagram_url", widget: "string", required: false }
              - { label: "Facebook link", name: "facebook_url", widget: "string", required: false }
              - { label: "TikTok link", name: "tiktok_url", widget: "string", required: false }
              - { label: "Xiaohongshu 小红书 link", name: "xiaohongshu_url", widget: "string", required: false }
          - label: "Marketing & tracking"
            name: "marketing"
            widget: "object"
            collapsed: true
            hint: "Measures visits and which ads lead to sales. Leave empty to switch off."
            fields:
              - { label: "Meta Pixel ID", name: "meta_pixel_id", widget: "string", required: false, hint: "Numbers only, from Meta Events Manager → Data sources." }
              - { label: "Google Analytics 4 measurement ID", name: "ga4_id", widget: "string", required: false, hint: "Looks like G-XXXXXXXXXX, from Google Analytics → Admin → Data streams." }
          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Build Your Own Blend", name: "custom_blend", widget: "boolean", default: true,
                  hint: "Shows the note picker after a Bazi reading and the personalized blend section on the Shop page." }
              - { label: "Element scent recommendations", name: "element_scents", widget: "boolean", default: true,
                  hint: "Shows the matching element scents (J01–T03) after a Bazi reading." }
          - { label: "Currency", name: "currency", widget: "hidden", default: "SGD" }
          - label: "Checkout"
            name: "checkout"
            widget: "object"
            fields:
              - label: "PayNow"
                name: "paynow"
                widget: "object"
                fields:
                  - { label: "Offer PayNow", name: "enabled", widget: "boolean", default: true }
                  - { label: "Payee name", name: "payee_name", widget: "string", required: false, hint: "The name customers will see in their banking app." }
                  - { label: "PayNow UEN or mobile number", name: "uen_or_mobile", widget: "string", required: false, hint: "A Singapore mobile (e.g. 96272353) or your business UEN. Used to make the QR code for each order." }
                  - { label: "Fixed PayNow QR image (usually leave empty)", name: "qr_image", widget: "image", required: false, hint: "Not needed when the number/UEN above is filled in: the site makes a QR for each order with the amount and order number already filled in. Only used if the number/UEN is left empty." }
                  - { label: "Payment instructions", name: "instructions", widget: "text" }
              - label: "Delivery options"
                name: "delivery_options"
                label_singular: "Delivery option"
                widget: "list"
                summary: "{{fields.label}} — S${{fields.fee}}"
                fields:
                  - { label: "Name", name: "label", widget: "string", hint: "e.g. Delivery (Singapore) or Self-collection" }
                  - { label: "Fee (SGD)", name: "fee", widget: "number", value_type: "float", min: 0, default: 0 }
                  - { label: "Free when the order is over (SGD)", name: "free_over", widget: "number", value_type: "float", min: 0, required: false }
                  - { label: "Ask for an address", name: "needs_address", widget: "boolean", default: true }
              - { label: "Offer 'This is a gift' with a message", name: "gift_option", widget: "boolean", default: true }
              - { label: "Thank-you message", name: "thank_you_message", widget: "string" }
